    <filter id="borde" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.25" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="9"/>
