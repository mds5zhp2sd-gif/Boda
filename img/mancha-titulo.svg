    </filter>
  </defs>
  <g filter="url(#borde)">
    <path d="M10 18 C60 8 160 6 292 12 L288 50 C200 54 90 56 6 48 C2 38 4 26 10 18 Z" fill="#c9d3c1" opacity=".85"/>
    <path d="M24 22 C110 14 200 15 280 20 L276 44 C180 48 90 49 20 44 Z" fill="#bfcab6" opacity=".45"/>
  </g>
</svg>
