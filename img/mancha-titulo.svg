<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" preserveAspectRatio="none">
  <!-- Mancha de acuarela detrás de los títulos. Sustituible por un PNG propio (variable imagen-mancha en css/estilos.css). -->
