<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260">
  <!-- Lazada plana de gasa (como la del vídeo): dos alas anchas pellizcadas en el nudo, sin colas.
       El sello de lacre va encima del nudo (centro en 150,120). -->
  <defs>
    <filter id="gasa" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8 0.3" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="2" seed="8" result="g"/>
      <feColorMatrix in="g" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .44  0 0 0 .18 0" result="grano"/>
      <feComposite in="grano" in2="d" operator="in" result="gr"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="gr"/></feMerge>
    </filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#06101a" flood-opacity=".42"/>
    </filter>
    <linearGradient id="g1" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d8cebe"/><stop offset=".3" stop-color="#f4efe6"/><stop offset="1" stop-color="#ece5d9"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#d8cebe"/><stop offset=".3" stop-color="#f6f1e9"/><stop offset="1" stop-color="#e9e2d5"/></linearGradient>
    <linearGradient id="g3" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2c7b6"/><stop offset=".35" stop-color="#f3eee5"/><stop offset="1" stop-color="#ebe4d8"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2c7b6"/><stop offset=".35" stop-color="#f4efe7"/><stop offset="1" stop-color="#e8e1d4"/></linearGradient>
  </defs>
  <g filter="url(#sombra)">
    <g filter="url(#gasa)" fill-opacity=".95">
      <!-- dos alas anchas tipo pajarita, pellizcadas en el nudo, con el borde exterior recto y deshilachado -->
      <path d="M150 112 C120 92 72 62 24 56 L18 186 C66 178 118 150 150 128Z" fill="url(#g1)"/>
      <path d="M150 112 C180 92 228 62 276 56 L282 186 C234 178 182 150 150 128Z" fill="url(#g2)"/>
      <!-- nudo pellizcado -->
      <path d="M136 106 C144 98 156 98 164 106 C168 114 168 126 162 132 C154 138 146 138 138 132 C132 126 132 114 136 106Z" fill="#efe8dc"/>
    </g>
    <!-- pliegues que convergen en el nudo -->
    <g fill="none" stroke-linecap="round" opacity=".7">
      <path d="M142 114 C110 96 70 80 30 78 M142 126 C110 140 70 160 28 166" stroke="#cfc4b2" stroke-width="1.7"/>
      <path d="M142 120 C104 116 64 118 24 122" stroke="#ffffff" stroke-width="2"/>
      <path d="M158 114 C190 96 230 80 270 78 M158 126 C190 140 230 160 272 166" stroke="#cfc4b2" stroke-width="1.7"/>
      <path d="M158 120 C196 116 236 118 276 122" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>
</svg>
