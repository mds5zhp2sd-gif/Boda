<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260">
  <!-- Lazada de gasa marfil (como la del vídeo): nudo fruncido, dos lazadas en abanico y dos colas -->
  <defs>
    <filter id="gasa" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.35" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="8" result="g"/>
      <feColorMatrix in="g" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .44  0 0 0 .22 0" result="grano"/>
      <feComposite in="grano" in2="d" operator="in" result="gr"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="gr"/></feMerge>
    </filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#06101a" flood-opacity=".45"/>
    </filter>
    <linearGradient id="lazIzq" x1="1" y1=".4" x2="0" y2=".5">
      <stop offset="0" stop-color="#d9cfbf"/><stop offset=".35" stop-color="#f6f1e8"/><stop offset=".7" stop-color="#ece4d6"/><stop offset="1" stop-color="#fbf8f2"/>
    </linearGradient>
    <linearGradient id="lazDer" x1="0" y1=".4" x2="1" y2=".5">
      <stop offset="0" stop-color="#d9cfbf"/><stop offset=".35" stop-color="#f6f1e8"/><stop offset=".7" stop-color="#ebe3d4"/><stop offset="1" stop-color="#fbf8f2"/>
    </linearGradient>
    <linearGradient id="cola" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6ddcf"/><stop offset=".45" stop-color="#faf6ef"/><stop offset="1" stop-color="#ddd3c3"/>
    </linearGradient>
    <radialGradient id="nudo" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#fdfaf5"/><stop offset=".6" stop-color="#ebe3d5"/><stop offset="1" stop-color="#cfc4b2"/>
    </radialGradient>
  </defs>
  <g filter="url(#sombra)">
    <g filter="url(#gasa)" fill-opacity=".96">
      <!-- colas -->
      <path d="M138 122 C126 150 108 186 84 226 L72 250 L94 238 L104 252 C118 214 136 172 152 128Z" fill="url(#cola)"/>
      <path d="M160 124 C176 154 198 186 228 218 L240 240 L216 232 L210 248 C188 214 166 176 148 130Z" fill="url(#cola)"/>
      <!-- lazada izquierda (abanico) -->
      <path d="M150 112 C128 92 96 66 54 58 C30 54 14 66 12 90 C10 116 26 134 52 140 C90 148 126 132 150 120Z" fill="url(#lazIzq)"/>
      <!-- lazada derecha -->
      <path d="M150 112 C174 88 210 64 250 60 C276 58 290 74 290 98 C290 124 272 138 246 142 C206 146 172 132 150 120Z" fill="url(#lazDer)"/>
      <!-- nudo -->
      <path d="M130 100 C138 86 166 86 172 98 C180 112 176 132 164 138 C152 144 134 140 128 128 C123 118 124 108 130 100Z" fill="url(#nudo)"/>
    </g>
    <!-- pliegues de las lazadas: salen del nudo -->
    <g fill="none" stroke-linecap="round" opacity=".85">
      <path d="M140 108 C112 92 74 78 40 80" stroke="#c9bda9" stroke-width="2.2"/>
      <path d="M140 114 C106 106 66 104 26 104" stroke="#ffffff" stroke-width="2"/>
      <path d="M140 118 C110 122 76 128 40 128" stroke="#c9bda9" stroke-width="1.8"/>
      <path d="M160 108 C190 90 230 78 266 80" stroke="#c9bda9" stroke-width="2.2"/>
      <path d="M160 114 C196 106 236 104 278 106" stroke="#ffffff" stroke-width="2"/>
      <path d="M160 118 C192 122 228 130 262 130" stroke="#c9bda9" stroke-width="1.8"/>
      <path d="M144 132 C134 160 116 196 96 230" stroke="#cdc2b0" stroke-width="1.6"/>
      <path d="M156 132 C170 162 190 192 216 222" stroke="#cdc2b0" stroke-width="1.6"/>
      <!-- frunce del nudo -->
      <path d="M140 104 C146 112 146 124 140 132 M150 98 C154 110 154 124 150 136 M160 102 C164 112 164 124 160 132" stroke="#c4b7a2" stroke-width="1.5"/>
    </g>
  </g>
</svg>
