<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><!-- Lazada de cordel de yute; el sello va sobre el nudo (150,150) --><defs>
  <filter id="pelusa" filterUnits="userSpaceOnUse" x="-50" y="-50" width="1100" height="1100">
    <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="5" result="t"/>
